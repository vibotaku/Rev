name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rev
          POSTGRES_PASSWORD: rev
          POSTGRES_DB: rev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rev -d rev" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (embedded PGlite)
        run: npm test
      - name: Server tests (Postgres)
        run: npx vitest run
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: postgres://rev:rev@localhost:5432/rev
      - run: npm run build
      - name: Plugin ships the current CLI bundle
        run: git diff --exit-code -- plugins/rev/cli/rev.mjs || (echo "Run npm run build and commit plugins/rev/cli/rev.mjs" && exit 1)

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the compose stack
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)|" .env
          sed -i "s|^PUBLIC_URL=.*|PUBLIC_URL=http://localhost:8080|" .env
          docker compose up -d --build
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8080/api/health && break; sleep 2; done
          curl -fsS localhost:8080/api/health
          curl -fsS localhost:8080/api/setup/status | grep -q '"needsSetup":true'
          curl -fsS -o /dev/null localhost:8080/
          curl -fsS -o /dev/null localhost:8080/downloads/rev.mjs
          docker compose logs rev | grep -q "setup token"
          docker compose exec -T rev sh -c 'id -un && ffmpeg -version | head -1'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
